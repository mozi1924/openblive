name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Create GitHub pre-release (yellow label)"
        required: true
        default: true
        type: boolean

jobs:
  prepare-release-notes:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      release_body: ${{ steps.notes.outputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          current_ref=""
          range=""
          prev_tag=""

          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            current_ref="${GITHUB_REF_NAME}"
            prev_tag="$(git describe --tags --abbrev=0 "${current_ref}^" 2>/dev/null || true)"
            if [[ -n "${prev_tag}" ]]; then
              range="${prev_tag}..${current_ref}"
            else
              range="${current_ref}"
            fi
          else
            current_ref="HEAD"
            prev_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [[ -n "${prev_tag}" ]]; then
              range="${prev_tag}..HEAD"
            else
              range="HEAD"
            fi
          fi

          commit_log=""
          while IFS= read -r commit_sha; do
            [[ -z "${commit_sha}" ]] && continue

            commit_subject="$(git show -s --format=%s "${commit_sha}")"
            commit_author_name="$(git show -s --format=%an "${commit_sha}")"
            short_sha="${commit_sha:0:7}"
            commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${commit_sha}"
            commit_author_mention=""

            if [[ -n "${GITHUB_TOKEN:-}" ]]; then
              commit_author_mention="$(
                python3 - "${commit_sha}" <<'PY'
import json
import os
import sys
import urllib.request

sha = sys.argv[1]
api_base = os.environ.get("GITHUB_API_URL", "https://api.github.com")
repo = os.environ.get("GITHUB_REPOSITORY", "")
token = os.environ.get("GITHUB_TOKEN", "")
url = f"{api_base}/repos/{repo}/commits/{sha}"

request = urllib.request.Request(
    url,
    headers={
        "Accept": "application/vnd.github+json",
        "Authorization": f"Bearer {token}",
        "X-GitHub-Api-Version": "2022-11-28",
        "User-Agent": "release-notes-generator",
    },
)

try:
    with urllib.request.urlopen(request, timeout=10) as response:
        payload = json.load(response)
except Exception:
    sys.exit(0)

author = payload.get("author") or {}
committer = payload.get("committer") or {}
login = author.get("login") or committer.get("login") or ""
if login:
    sys.stdout.write(f"@{login}")
PY
              )"
            fi

            if [[ -z "${commit_author_mention}" ]]; then
              commit_author_mention="${commit_author_name}"
            fi

            commit_log+="- ${commit_subject} ([\`${short_sha}\`](${commit_url})) — ${commit_author_mention}"$'\n'
          done < <(git rev-list ${range} || true)

          if [[ -z "${commit_log}" ]]; then
            commit_log="- No commits found in this range."
          fi

          {
            echo "release_body<<EOF"
            echo "Automated release built by GitHub Actions."
            echo
            echo "## Changelog"
            if [[ -n "${prev_tag}" ]]; then
              echo "From \`${prev_tag}\` to \`${current_ref}\`:"
            else
              echo "From initial history to \`${current_ref}\`:"
            fi
            echo
            echo "${commit_log}"
            echo
            echo "## Notes"
            echo
            echo "macOS users need to remove the quarantine attribute before first launch:"
            echo
            echo "\`\`\`bash"
            echo "sudo xattr -dr com.apple.quarantine \"/Applications/OpenBlive Studio.app\""
            echo "\`\`\`"
            echo
            echo "If the app is installed outside \`/Applications\`, replace the path with the actual app location."
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  tauri-release:
    needs: prepare-release-notes
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v__VERSION__-dev.{0}', github.run_number) }}
          releaseName: "OpenBlive Studio v__VERSION__"
          releaseBody: ${{ needs.prepare-release-notes.outputs.release_body }}
          releaseDraft: false
          prerelease: ${{ (startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && (inputs.prerelease == true || inputs.prerelease == 'true')) }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}
