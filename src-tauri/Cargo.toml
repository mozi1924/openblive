[package]
name = "openblive-studio"
version = "0.1.9"
description = "OpenBlive Studio desktop assistant for Bilibili streamers"
authors = ["mozi1924"]
edition = "2021"

[lib]
name = "openblive_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "cookies", "multipart", "rustls-tls", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "gzip", "deflate", "brotli"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "net"] }
axum = { version = "0.8", features = ["ws"] }
url = "2"
md5 = "0.8.0"
chrono = "0.4"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
flate2 = "1"
brotli = "6"
bytes = "1"

serde_urlencoded = "0.7"
dirs = "6"
aes-gcm = "0.10"
aes = "0.8.3"
cbc = "0.1.2"
base64 = "0.22"
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
sha2 = "0.10"
hex = "0.4"
urlencoding = "2.1.3"
qrcode-generator = "5"
prost = "0.13"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2.10.1"
