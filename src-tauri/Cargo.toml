[package]
name = "tauri-app"
version = "0.1.0"
description = "Bilibili live desktop tool"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
url = "2"
md5 = "0.8.0"
chrono = "0.4"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
flate2 = "1"
brotli = "6"
bytes = "1"

serde_urlencoded = "0.7"
dirs = "6"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
keyring = "3"
rsa = { version = "0.9", features = ["pem"] }
sha2 = "0.10"
hex = "0.4"
